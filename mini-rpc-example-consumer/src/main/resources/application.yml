spring:
  application:
    name: mini-rpc-example-consumer

mini-rpc:
  enabled: true
  # 可选 json / jdk；正式场景不建议反序列化来源不可信的 JDK 对象流。
  serializer: json
  # 多个 Provider 可选 round-robin / random。
  load-balance: round-robin
  registry-address: 127.0.0.1:2181
  request-timeout: 5s
  # 连接写空闲 15 秒时发送 PING；45 秒没有收到任何数据时关闭连接。
  heartbeat-interval: 15s
  heartbeat-timeout: 45s

logging:
  level:
    # 只打开 mini-RPC Consumer 传输层的 DEBUG，用于观察 PING/PONG，避免输出大量 Netty 内部日志。
    io.github.kaano.minirpc.transport.client: DEBUG
