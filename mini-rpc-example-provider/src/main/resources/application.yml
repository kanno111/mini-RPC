spring:
  application:
    name: mini-rpc-example-provider

mini-rpc:
  enabled: true
  # Provider 响应正文使用 JSON；Consumer 可按协议头自动选择对应解码器。
  serializer: json
  provider-enabled: true
  registry-address: 127.0.0.1:2181
  server-host: 127.0.0.1
  server-port: 8080
  # Spring 关闭时最多等待 10 秒，让已经开始的 RPC 请求完成响应。
  shutdown-timeout: 10s
  load-balance: round_robin
